# Spark settings for ShopLake, mounted into the container at
# /opt/spark/conf/spark-defaults.conf. Every spark-submit / pyspark picks them up.

# ---- Iceberg: a Spark catalog called "iceberg", backed by the REST catalog ----
# Same name as Trino's catalog, so the same table names work in both engines:
#   iceberg.bronze.orders  (Spark)  ==  iceberg.bronze.orders  (Trino)
# Docs: https://iceberg.apache.org/docs/latest/spark-configuration/
spark.sql.extensions                       org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type             rest
spark.sql.catalog.iceberg.uri              http://iceberg-rest:8181
spark.sql.catalog.iceberg.warehouse        s3://warehouse/
spark.sql.catalog.iceberg.io-impl          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint      http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.defaultCatalog                   iceberg

# ---- s3a:// : how Spark reads RAW files (CSV) from the landing bucket ----
# Credentials come from the AWS_* environment variables (S3A's default chain).
# Docs: https://hadoop.apache.org/docs/stable/hadoop-aws/tools/hadoop-aws/index.html
spark.hadoop.fs.s3a.endpoint               http://minio:9000
spark.hadoop.fs.s3a.endpoint.region        us-east-1
spark.hadoop.fs.s3a.path.style.access      true
spark.hadoop.fs.s3a.connection.ssl.enabled false

# ---- Laptop sizing: one JVM (local mode), 1.5 GB heap, few shuffle partitions ----
spark.master                               local[*]
spark.driver.memory                        1536m
spark.sql.shuffle.partitions               8
spark.ui.port                              4040
