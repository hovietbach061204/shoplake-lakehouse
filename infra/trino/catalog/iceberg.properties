# Trino catalog "iceberg": Iceberg tables via the REST catalog, files in MinIO.
# Docs: https://trino.io/docs/current/connector/iceberg.html
#       https://trino.io/docs/current/object-storage/file-system-s3.html
connector.name=iceberg

# Where the table pointers live (the catalog)
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181

# 'warehouse' is a hint sent to the catalog server (GET /v1/config?warehouse=...),
# not a path Trino writes to. The server decides table locations; our test
# server ignores this and uses its own CATALOG_WAREHOUSE. In Polaris it is a
# catalog name, in AWS Glue an account ID.
# iceberg.rest-catalog.warehouse matters when Trino connects to a REST service that uses the value to select a catalog.
# For example, suppose one Apache Polaris server hosts two catalogs, dev and prod. With iceberg.rest-catalog.warehouse=dev,
# Trino resolves iceberg.playground.orders_demo in dev.
# Change the setting to prod, reload the Trino configuration, and the same SQL looks for playground.orders_demo in prod.
# It can find a different table or report that the table doesn’t exist. Apache Polaris Trino guide
# In your ShopLake M1 setup, iceberg-rest serves one catalog and ignores the warehouse request.
# Changing that Trino setting therefore has no effect on which table you reach or where its files are stored.
iceberg.rest-catalog.warehouse=s3://warehouse/
# this is the URI of your MinIO bucket named warehouse.

# How Trino reads and writes the files themselves (S3 API on MinIO)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=${ENV:AWS_REGION}
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}

# Defaults for new tables
iceberg.file-format=PARQUET
